<script type="module">
  const blocks = document.querySelectorAll(
    'pre code.language-mermaid, .language-mermaid pre code'
  );

  if (blocks.length > 0) {
    try {
      const { default: mermaid } = await import(
        'https://cdn.jsdelivr.net/npm/mermaid@12.3.0/dist/mermaid.esm.min.mjs'
      );

      mermaid.initialize({
        startOnLoad: false,
        theme: 'dark',
        securityLevel: 'strict',
        suppressErrorRendering: true
      });

      for (const code of blocks) {
        const diagram = document.createElement('div');
        diagram.className = 'mermaid';
        diagram.textContent = code.textContent;

        const container =
          code.closest('.highlighter-rouge') || code.closest('pre');
        container.replaceWith(diagram);

        try {
          await mermaid.run({ nodes: [diagram] });
        } catch (error) {
          diagram.replaceWith(container);
          console.error('Unable to render Mermaid diagram.', error);
        }
      }
    } catch (error) {
      console.error('Unable to load Mermaid.', error);
    }
  }
</script>

<!-- end custom footer snippets -->
